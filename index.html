<!doctype html>
<html lang="en">
    <head>
        <title>Etch-a-Sketch</title>
        <meta charset="utf-8">
        <script src="javascript.js" defer></script>
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
        <h1 class="header">Etch-a-Sketch</h1>
        <div class="buttons">
            <button class="generalBtn" id="clearBtn">Clear Grid</button>
            <button class="generalBtn" id="sizeBtn">Change Grid Size: </button>
            <button class="generalBtn" id="brushBtn">
                Hover Over: 
                <span class="tooltip">Press "Alt" to toggle.</span>
            </button>
            <button class="generalBtn" id="shadingBtn">Shading: <span class="shadeOnOff"> </span></button>
            <button class="generalBtn" id="rainbowBtn">Rainbow</button>
        </div>
        <div class="board" id="board"></div>
    </body>
</html>
